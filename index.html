<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="content">
            <h1 class="title">Checkout</h1>

            <div class="progress-bar">
                <div class="step active"></div>
                <div class="step active"></div>
                <div class="step"></div>
                <div class="step"></div>
            </div>

            <div class="payment-options">
                <button class="paypal"><img src="https://pngimg.com/uploads/paypal/paypal_PNG9.png" alt=""></button>
                <button class="visa"><img
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDMlg0Q1j0rJQu53GjxP0zo-3TZqyrTZDVWr1lKP_sBA&s=10"
                        alt=""></button>
                <button class="gpay"><img
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTO9eAnS4XqK6eWzo0d1kARXwRB05UCV_3mTaHY_r0OMA&s=10"
                        alt=""></button>
            </div>

            <div class="seperator">
                <hr class="line">
                <p>or pay using credit card</p>
                <hr class="line">
            </div>

            <div class="card-info">
                <div class="inputs">
                    <label for="" class="input-label">Card holder Full name</label>
                    <input type="text" placeholder="Enter your full name">
                </div>
                <div class="inputs">
                    <label for="" class="input-label">Card Number</label>
                    <input type="number" placeholder="0000 0000 0000 0000">
                </div>
                <div class="inputs">
                    <label for="" class="input-label">Expirty Date / CVV</label>
                    

                    <div class="break">
                        <input type="number" placeholder="01/24">
                        <input type="number" placeholder="cvv">

                    </div>
                </div>
                <button class="checkout-btn">Checkout</button>
            </div>

        </div>
    </div>

</body>

</html>
